name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already publishing; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the site is complete and self-contained
        run: |
          set -e
          for f in index.html 404.html sitemap.xml robots.txt \
                   assets/css/style.css assets/js/main.js assets/img/rahul.jpg \
                   projects/index.html work/index.html skills/index.html \
                   about/index.html contact/index.html; do
            [ -f "$f" ] || { echo "::error::missing required file $f"; exit 1; }
          done

          # The site ships no third-party runtime code. If a CDN <script> or a
          # vendored library creeps back in, fail rather than quietly regress.
          if grep -rnoE '<script[^>]+src="https?://' --include='*.html' .; then
            echo "::error::external script tag found — the site must stay self-contained"
            exit 1
          fi

          # The generated pages must match tools/, so nobody hand-edits one page
          # and leaves the other five behind.
          python3 tools/build.py >/dev/null
          if ! git diff --quiet; then
            echo "::error::generated pages are stale — run 'python3 tools/build.py' and commit"
            git --no-pager diff --stat
            exit 1
          fi

          echo "Site check passed."

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
