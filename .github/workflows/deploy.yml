name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already publishing; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required assets are present
        run: |
          set -e
          for f in index.html assets/css/style.css assets/js/main.js \
                   assets/vendor/gsap.min.js assets/vendor/ScrollTrigger.min.js \
                   assets/vendor/lenis.min.js; do
            [ -f "$f" ] || { echo "::error::missing required file $f"; exit 1; }
          done
          if [ ! -f assets/img/rahul.jpg ]; then
            echo "::warning::assets/img/rahul.jpg is missing — the about photo will fall back to a placeholder."
          fi
          echo "Asset check passed."

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
