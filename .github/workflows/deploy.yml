name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already publishing; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the site is complete and self-contained
        run: |
          set -e
          for f in index.html experience.html projects.html skills.html about.html contact.html 404.html \
                   assets/css/site.css assets/js/site.js assets/js/data.js assets/img/rahul.jpg; do
            [ -f "$f" ] || { echo "::error::missing required file $f"; exit 1; }
          done
          # The site ships no third-party code or fonts. Fail if a CDN script or stylesheet creeps in.
          if grep -rnoE '<(script|link)[^>]+(src|href)="https?://' --include='*.html' . | grep -v 'rel="canonical"'; then
            echo "::error::external script or stylesheet found; the site must stay self-contained"
            exit 1
          fi
          echo "Site check passed."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
